name: CI / Release

# One flow, triggered by a `v*` tag push:
#   build-and-test  →  publish (npm pending, gate)  →  promote (npm latest, gate)
#                   →  build-binaries (5 targets)    →  release (public unerr-docs
#                      Release + sync install scripts)  →  homebrew / scoop
# On `main` pushes and PRs only build-and-test runs (the release jobs are
# gated on `refs/tags/v`). unerr-cli is PRIVATE, so binaries and install
# scripts are published to the PUBLIC repo unerr-docs.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one OS/Node failure cancel the other legs — we want to see
      # every platform's result in a single run (recommended for cross-platform
      # matrices).
      fail-fast: false
      matrix:
        # Blacksmith runner images (faster GitHub Actions runners). Linux boots
        # as a Firecracker microVM; macOS is Apple Silicon. These require the
        # Blacksmith GitHub App to be installed on this repo. Sizes mirror
        # GitHub-hosted (4 vCPU Linux; macOS minimum is 6 vCPU). Windows is not
        # in the matrix — the product has POSIX assumptions (open-file delete,
        # path separators, /bin/sh, UDS sockets) that aren't worth fixing until
        # Windows is a supported install target.
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-latest
        # 24 = supported floor (engines.node >=24.0) — the only SQLite path is
        # the built-in node:sqlite, stable since Node 24. Must stay green on
        # both OSes.
        node-version: [24]

    steps:
      - name: Mint GitHub App token for the contracts submodule
        # The default GITHUB_TOKEN is scoped to this repo only and cannot clone
        # the internal unerr-contracts submodule. Mint a token scoped to both
        # this repo (main clone) and unerr-contracts (submodule). The App is
        # installed org-wide on unerr-ai, so no per-repo secret setup is needed.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CONTRACTS_APP_ID }}
          private-key: ${{ secrets.CONTRACTS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            unerr-cli
            unerr-contracts

      - uses: actions/checkout@v4
        with:
          submodules: true # vendor/contracts (link: target); postinstall builds its dist/
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install

      - name: Verify SQLite + graph backends
        # Fail fast and loud if node:sqlite is missing (Node < 24) or the
        # cozo-node native binary did not build (pnpm/npm skipped its install
        # script). Without this the miss surfaces as noise across ~170 test
        # files instead of one cause.
        run: pnpm run check:native

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Point /bin/sh at bash (Ubuntu)
        # On Ubuntu `/bin/sh` is dash; on macOS it is bash. unerr's exec runner
        # spawns `/bin/sh -lc <cmd>` — a LOGIN shell — to capture the user's
        # real environment (PATH, nvm/pyenv shims). A login shell reads
        # /etc/profile, and the Blacksmith Linux runner's profile sources
        # /run/blacksmith/job.env, written in bash syntax (`declare -x …`) to
        # propagate env across steps. dash cannot parse `declare`, so it prints
        # `/run/blacksmith/job.env: declare: not found` into every captured
        # command's output and breaks the exec/shell-capture tests. This is
        # filesystem-driven (the profile sources the file), so clearing
        # BASH_ENV/ENV does nothing — and `dpkg-reconfigure dash` did not
        # repoint /bin/sh on this image. Force the symlink to bash directly:
        # bash parses `declare` fine, which is why the macOS leg (where /bin/sh
        # is already bash) passes. The runner is an ephemeral microVM, so this
        # only affects this job. Guard on the matrix string (not runner.os) so
        # the match doesn't depend on the runner-provided context.
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          echo "before: /bin/sh -> $(readlink -f /bin/sh)"
          sudo ln -sf /bin/bash /bin/sh
          echo "after:  /bin/sh -> $(readlink -f /bin/sh)"
          # Proof in the log: a login /bin/sh must now emit nothing (no
          # `declare: not found`). If this prints the error, the symlink swap
          # did not take and the test step will still fail.
          echo "--- login /bin/sh sanity (expect no declare error) ---"
          /bin/sh -lc 'true'
          echo "--- sanity exit: $? ---"

      - name: Test
        # Redirect stdin from /dev/null so vitest doesn't engage raw mode and
        # hang (see CLAUDE.md "test:run redirects stdin from /dev/null").
        # `pnpm exec` invokes the local vitest binary directly so this matches
        # the `test:run` script's behaviour without re-wrapping the redirect.
        shell: bash
        run: pnpm exec vitest run < /dev/null

      - name: Build
        run: pnpm run build

  # Job 1 — publish the tagged version to npm under a temporary `pending`
  # dist-tag (MANUAL APPROVAL #1). Runs only on `v*` tag pushes. The version
  # is derived from the tag so the npm version always equals the tag.
  #
  # `@unerr-ai/unerr` is the BINARY WRAPPER (esbuild optionalDependencies
  # pattern), NOT the Node CLI bundle: a tiny shim package whose
  # optionalDependencies are five per-platform packages, each carrying the
  # compiled native binary. `npm install -g @unerr-ai/unerr` installs the shim
  # plus the single platform package matching the user's os/cpu and runs the
  # native binary — no Node-version match, no node-pre-gyp / native-module
  # compile. Needs the binaries from build-binaries.
  publish:
    needs: [build-and-test, build-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Manual-approval gate #1: this requires a GitHub Environment named "npm-publish"
    # with a required reviewer configured in repo settings (Settings → Environments).
    # The job holds until a reviewer approves, same mechanism as web-landing's
    # `environment: production`.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    # Expose the published version so the `promote` job can flip its dist-tag.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Only packaging/npm/ + the downloaded binaries are needed here — no
      # contracts submodule, no root build, so a plain checkout is enough.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Derive version + dist-tag from tag
        id: version
        run: |
          # Strip the leading `v`, e.g. tag `v0.4.0-beta.1` → `0.4.0-beta.1`.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A tag containing `-` is a prerelease (e.g. -beta.1, -rc.2). Publish it
          # under the durable `beta` dist-tag and NEVER promote it to `latest`
          # (the promote job is skipped for prereleases). Stable tags use the
          # temporary `pending` tag, which the promote gate flips to `latest`.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Publishing PRERELEASE $VERSION under dist-tag: beta"
          else
            echo "dist_tag=pending" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Publishing STABLE $VERSION under dist-tag: pending"
          fi

      - name: Download compiled binaries
        # rawbin-* artifacts each carry one dist/bin/unerr-<target>[.exe];
        # merge-multiple lands them all in dist/bin for the packaging script.
        uses: actions/download-artifact@v4
        with:
          pattern: rawbin-*
          merge-multiple: true
          path: dist/bin

      - name: Stage npm packages (wrapper + 5 platform binaries)
        run: |
          chmod +x dist/bin/unerr-darwin-x64 dist/bin/unerr-darwin-arm64 \
                   dist/bin/unerr-linux-x64 dist/bin/unerr-linux-arm64 || true
          ls -lh dist/bin
          node packaging/npm/build-npm-packages.mjs "${{ steps.version.outputs.version }}"

      - name: Publish to npm (${{ steps.version.outputs.dist_tag }} dist-tag)
        # Platform packages first, then the wrapper — npm resolves the wrapper's
        # optionalDependencies at install time. Published under the dist-tag from
        # the version step: `beta` for prereleases (stays off `latest` forever),
        # or `pending` for stable (the promote gate flips it to `latest`). Either
        # way, `npm install @unerr-ai/unerr` (no version) keeps resolving the
        # previous `latest` until/unless a stable release is promoted.
        run: |
          DIST_TAG="${{ steps.version.outputs.dist_tag }}"
          for d in packaging/npm/dist/@unerr-ai/unerr-*; do
            echo "publishing $d under @$DIST_TAG"
            npm publish "$d" --access public --tag "$DIST_TAG"
          done
          echo "publishing wrapper packaging/npm/dist/@unerr-ai/unerr under @$DIST_TAG"
          npm publish packaging/npm/dist/@unerr-ai/unerr --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Job 2 — promote the just-published version from `pending` to `latest`
  # (MANUAL APPROVAL #2). This is the gate that makes the new version the
  # default `npm install @unerr-ai/unerr` target.
  #
  # SKIPPED for prereleases (tag contains `-`, e.g. v0.4.0-beta.1): a beta is
  # published under the `beta` dist-tag and must never become `latest`, so this
  # job does not run at all for those tags.
  promote:
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Manual-approval gate #2: a SEPARATE GitHub Environment named "npm-promote"
    # with its own required reviewer (Settings → Environments). The job holds
    # until that reviewer approves — distinct from the `npm-publish` gate above.
    environment: npm-promote

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Promote pending → latest
        # Flip the dist-tag so the new version becomes the default install target
        # for the wrapper AND each platform package, then drop the temporary
        # `pending` tag. The wrapper pins its platform deps by exact version, so
        # the wrapper's `latest` is what `npm install -g @unerr-ai/unerr` resolves.
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          for pkg in \
            @unerr-ai/unerr \
            @unerr-ai/unerr-darwin-x64 \
            @unerr-ai/unerr-darwin-arm64 \
            @unerr-ai/unerr-linux-x64 \
            @unerr-ai/unerr-linux-arm64 \
            @unerr-ai/unerr-windows-x64; do
            echo "promoting $pkg@$VERSION"
            npm dist-tag add "$pkg@$VERSION" latest
            npm dist-tag rm  "$pkg@$VERSION" pending
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 3 — compile self-contained native binaries (5 targets). Tag-only.
  # Consolidated from the former release-binary.yml. Depends only on
  # build-and-test, so it compiles in parallel with the npm publish/promote
  # gates; nothing is published from this job — it just uploads artifacts.
  # scripts/build-binary.ts stages the cozo / @parcel/watcher .node addons and
  # the tree-sitter .wasm grammars, then runs `bun build --compile`.
  # ---------------------------------------------------------------------------
  build-binaries:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    name: binary / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64   # Apple Silicon — native runner (M1)
            runner: macos-14
            os: darwin
            smoke: true
          - target: darwin-x64     # Intel Mac — last Intel image
            runner: macos-13
            os: darwin
            smoke: true
          - target: linux-x64      # native runner
            runner: ubuntu-latest
            os: linux
            smoke: true
          - target: linux-arm64    # cross-compiled from x64; smoke skipped (won't run on x64)
            runner: ubuntu-latest
            os: linux
            smoke: false
          - target: windows-x64    # native runner
            runner: windows-latest
            os: windows
            smoke: true
    runs-on: ${{ matrix.runner }}
    # Map the codesign secret to env so the step `if:` can test it — the
    # `secrets` context is NOT available in `if:` conditions, but `env` is.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}

    steps:
      - name: Mint GitHub App token (contracts submodule access)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CONTRACTS_APP_ID }}
          private-key: ${{ secrets.CONTRACTS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            unerr-cli
            unerr-contracts

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build contracts (required before binary compile)
        run: pnpm run build:contracts

      - name: Compile binary (${{ matrix.target }})
        run: bun scripts/build-binary.ts --target ${{ matrix.target }}
        env:
          UNERR_PROD_BUILD: "1"

      - name: Smoke test (Unix)
        if: ${{ matrix.smoke && matrix.os != 'windows' }}
        run: |
          chmod +x dist/bin/unerr-${{ matrix.target }}
          dist/bin/unerr-${{ matrix.target }} --version
          dist/bin/unerr-${{ matrix.target }} --help

      - name: Smoke test (Windows)
        if: ${{ matrix.smoke && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          .\dist\bin\unerr-windows-x64.exe --version
          .\dist\bin\unerr-windows-x64.exe --help

      # macOS codesign + notarize — optional, guarded by secret presence.
      # Set the five MACOS_* secrets to enable; absent them the leg stays green
      # and produces an unsigned (but functional) binary.
      - name: Import Developer ID certificate
        if: ${{ matrix.os == 'darwin' && env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

      - name: Codesign binary
        if: ${{ matrix.os == 'darwin' && env.MACOS_CERTIFICATE != '' }}
        run: |
          codesign --force --options runtime \
            --sign "Developer ID Application" \
            dist/bin/unerr-${{ matrix.target }}

      - name: Notarize binary
        if: ${{ matrix.os == 'darwin' && env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PWD: ${{ secrets.MACOS_NOTARY_PWD }}
        run: |
          xcrun notarytool submit dist/bin/unerr-${{ matrix.target }} \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id  "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PWD" \
            --wait

      - name: Package archive (Unix — tar.gz)
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        run: |
          ARCHIVE="unerr-${{ matrix.target }}.tar.gz"
          cp dist/bin/unerr-${{ matrix.target }} unerr
          tar -czf "$ARCHIVE" unerr
          rm unerr
          # macOS runners ship `shasum`, Linux ships `sha256sum` — use whichever exists.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Package archive (Windows — zip)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $archive = "unerr-windows-x64.zip"
          Copy-Item dist\bin\unerr-windows-x64.exe unerr.exe
          Compress-Archive -Path unerr.exe -DestinationPath $archive
          Remove-Item unerr.exe
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload archive artifact (Unix)
        if: ${{ matrix.os != 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            unerr-${{ matrix.target }}.tar.gz
            unerr-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload archive artifact (Windows)
        if: ${{ matrix.os == 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            unerr-windows-x64.zip
            unerr-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

      # Raw (post-codesign) binary — input to the npm wrapper packaging in the
      # `publish` job. Glob covers the bare name and the Windows `.exe`.
      - name: Upload raw binary (npm packaging input)
        uses: actions/upload-artifact@v4
        with:
          name: rawbin-${{ matrix.target }}
          path: dist/bin/unerr-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4 — publish the binaries to the PUBLIC unerr-docs repo and sync the
  # install scripts there. Gated to run only AFTER the binaries are built AND
  # npm is promoted to `latest`, so nothing reaches users until the maintainer
  # has approved both npm gates above.
  #
  # unerr-cli is private → its own Release assets need auth to download.
  # unerr-docs is public: its Releases host the tarballs/zip + SHA256SUMS, and
  # its `main` serves install / install.ps1 at raw.githubusercontent.com.
  # The commit to unerr-docs touches ONLY those two files (docs rarely change).
  # ---------------------------------------------------------------------------
  release:
    needs: [build-binaries, promote]
    # Run once the binaries are built AND npm is settled — promote either
    # succeeded (stable) or was SKIPPED (prerelease). `always()` is required so a
    # skipped promote doesn't auto-skip this job; build-binaries.result gates it
    # to tag runs (build-binaries only runs on `v*`).
    if: ${{ always() && needs.build-binaries.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token for unerr-docs
        id: docs-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CONTRACTS_APP_ID }}
          private-key: ${{ secrets.CONTRACTS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            unerr-docs

      - name: Checkout unerr-cli (install scripts + packaging templates live here)
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets/

      - name: Build SHA256SUMS
        working-directory: release-assets
        run: |
          cat *.sha256 | sort > SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Sync install scripts to unerr-docs main
        # Only install + install.ps1 are pushed, and only when they changed.
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/unerr-docs.git" docs-repo
          cp install     docs-repo/install
          cp install.ps1 docs-repo/install.ps1
          cd docs-repo
          git config user.name  "unerr-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add install install.ps1
          if git diff --cached --quiet; then
            echo "install scripts unchanged — nothing to commit"
          else
            git commit -m "chore(install): sync install scripts for ${TAG}"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release on unerr-docs
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository_owner }}/unerr-docs
          token: ${{ steps.docs-token.outputs.token }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Pre-release if the tag carries a pre-release segment (e.g. v1.0.0-rc.1).
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Notes are generated from unerr-cli, not unerr-docs, so don't
          # auto-generate from the docs repo's history.
          generate_release_notes: false
          body: |
            unerr ${{ github.ref_name }} — native binaries.

            Install (macOS / Linux):
            `curl -fsSL https://raw.githubusercontent.com/unerr-ai/unerr-docs/main/install | bash`

            All channels: see INSTALL.md in unerr-cli. Verify downloads against `SHA256SUMS` below.
          files: |
            release-assets/unerr-darwin-x64.tar.gz
            release-assets/unerr-darwin-arm64.tar.gz
            release-assets/unerr-linux-x64.tar.gz
            release-assets/unerr-linux-arm64.tar.gz
            release-assets/unerr-windows-x64.zip
            release-assets/SHA256SUMS

  # ---------------------------------------------------------------------------
  # Job 5 — bump the Homebrew tap (unerr-ai/homebrew-tap). Opt-in: runs only
  # when repo variable ENABLE_HOMEBREW == 'true' AND the tap repo exists.
  # ---------------------------------------------------------------------------
  homebrew:
    needs: release
    # Stable releases only — never bump the tap to a prerelease (tag with `-`).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_HOMEBREW == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token for the tap
        id: tap-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CONTRACTS_APP_ID }}
          private-key: ${{ secrets.CONTRACTS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap

      - name: Checkout unerr-cli (formula template)
        uses: actions/checkout@v4

      - name: Fetch SHA256SUMS from the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL -o SHA256SUMS \
            "https://github.com/${{ github.repository_owner }}/unerr-docs/releases/download/${TAG}/SHA256SUMS"
          cat SHA256SUMS

      - name: Render + push formula
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          VERSION="${TAG#v}"
          sum() { grep " unerr-$1$" SHA256SUMS | awk '{print $1}'; }
          sed \
            -e "s/^  version  .*/  version  \"${VERSION}\"/" \
            -e "s/PLACEHOLDER_SHA256_DARWIN_ARM64/$(sum darwin-arm64.tar.gz)/" \
            -e "s/PLACEHOLDER_SHA256_DARWIN_X64/$(sum darwin-x64.tar.gz)/" \
            -e "s/PLACEHOLDER_SHA256_LINUX_ARM64/$(sum linux-arm64.tar.gz)/" \
            -e "s/PLACEHOLDER_SHA256_LINUX_X64/$(sum linux-x64.tar.gz)/" \
            packaging/homebrew/unerr.rb > unerr.rb.rendered
          echo "=== rendered formula ===" && cat unerr.rb.rendered
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp unerr.rb.rendered tap/Formula/unerr.rb
          cd tap
          git config user.name  "unerr-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Formula/unerr.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
          else
            git commit -m "unerr ${TAG}"
            git push origin HEAD
          fi

  # ---------------------------------------------------------------------------
  # Job 6 — bump the Scoop bucket (unerr-ai/scoop-bucket). Opt-in: runs only
  # when repo variable ENABLE_SCOOP == 'true' AND the bucket repo exists.
  # ---------------------------------------------------------------------------
  scoop:
    needs: release
    # Stable releases only — never bump the bucket to a prerelease (tag with `-`).
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_SCOOP == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token for the bucket
        id: bucket-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CONTRACTS_APP_ID }}
          private-key: ${{ secrets.CONTRACTS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            scoop-bucket

      - name: Checkout unerr-cli (manifest template)
        uses: actions/checkout@v4

      - name: Fetch SHA256SUMS from the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSL -o SHA256SUMS \
            "https://github.com/${{ github.repository_owner }}/unerr-docs/releases/download/${TAG}/SHA256SUMS"

      - name: Render + push manifest
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.bucket-token.outputs.token }}
        run: |
          VERSION="${TAG#v}"
          WIN_X64=$(grep " unerr-windows-x64.zip$" SHA256SUMS | awk '{print $1}')
          # Replace the literal version + sha; leave scoop's own `v$version`
          # autoupdate template token untouched (it does not match v0.3.5).
          sed \
            -e "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" \
            -e "s#download/v0\.3\.5/#download/v${VERSION}/#g" \
            -e "s/PLACEHOLDER_SHA256_WINDOWS_X64/${WIN_X64}/" \
            packaging/scoop/unerr.json > unerr.json.rendered
          echo "=== rendered manifest ===" && cat unerr.json.rendered
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp unerr.json.rendered bucket/bucket/unerr.json
          cd bucket
          git config user.name  "unerr-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add bucket/unerr.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "unerr ${TAG}"
            git push origin HEAD
          fi
