name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one OS/Node failure cancel the other legs — we want to see
      # every platform's result in a single run (recommended for cross-platform
      # matrices, and useful while Windows is being brought online).
      fail-fast: false
      matrix:
        # Blacksmith runner images (faster GitHub Actions runners). Linux +
        # Windows boot as Firecracker microVMs; macOS is Apple Silicon. These
        # require the Blacksmith GitHub App to be installed on this repo. Sizes
        # mirror GitHub-hosted (4 vCPU Linux/Windows; macOS minimum is 6 vCPU).
        # Windows on Blacksmith is Public Beta (host = Windows Server 2025).
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-latest
          - blacksmith-4vcpu-windows-2025
        # 20 = supported floor (engines.node >=20.9), 22 = recommended line
        # (>=22.5), 24 = current. All three Node lines on all three OSes must
        # stay green.
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install

      - name: Verify native DB bindings
        # Fail fast and loud if cozo-node / better-sqlite3 native binaries did
        # not build (e.g. pnpm/npm skipped their install scripts). Without this
        # the miss surfaces as noise across ~170 test files instead of one cause.
        run: pnpm run check:native

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        # Run under bash on every OS. The Blacksmith Windows runner (based on
        # GitHub's Windows Server 2025 image) provides Git Bash, which supplies
        # `/dev/null` — so the stdin redirect that stops
        # vitest hanging in raw mode works the same everywhere. `pnpm exec`
        # invokes the local vitest binary directly, bypassing pnpm's package.json
        # script wrapper (which on Windows would run the `< /dev/null` string
        # through cmd.exe, where /dev/null does not exist).
        shell: bash
        run: pnpm exec vitest run < /dev/null

      - name: Build
        run: pnpm run build

  # Job 1 — publish the tagged version to npm under a temporary `pending`
  # dist-tag (MANUAL APPROVAL #1). Runs only on `v*` tag pushes. The version
  # is derived from the tag so the npm version always equals the tag.
  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Manual-approval gate #1: this requires a GitHub Environment named "npm-publish"
    # with a required reviewer configured in repo settings (Settings → Environments).
    # The job holds until a reviewer approves, same mechanism as web-landing's
    # `environment: production`.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    # Expose the published version so the `promote` job can flip its dist-tag.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Derive version from tag
        id: version
        run: |
          # Strip the leading `v` from the tag, e.g. tag `v0.2.13` → `0.2.13`.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Set package.json version from tag
        run: |
          # Write the tag-derived version into package.json without creating a
          # git tag or commit, so the npm version always equals the git tag.
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: pnpm install

      - name: Build (production — strips dev mode)
        run: pnpm run build
        env:
          UNERR_PROD_BUILD: "1"

      - name: Verify dev-free
        run: |
          # a. Built bundle must not contain the dev reader (stripped by UNERR_PROD_BUILD=1).
          grep -q "applyDevConfig" dist/cli.js && { echo "::error::dev reader present in production bundle"; exit 1; } || echo "ok: no dev reader in bundle"
          # b. npm tarball must not include dev scaffolding (dev.json / dev-config / cloud/dev-mode).
          npm pack --dry-run 2>&1 | grep -E "dev\.json|dev-config|dev-mode" && { echo "::error::dev scaffolding in tarball"; exit 1; } || echo "ok: tarball is dev-free"

      - name: Publish to npm (pending dist-tag)
        # Publish under the temporary `pending` dist-tag, NOT `latest`. This holds
        # the release back: `npm install @unerr-ai/unerr` (no version) keeps
        # resolving the previous `latest` until the `promote` job flips it.
        run: pnpm publish --no-git-checks --tag pending
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Job 2 — promote the just-published version from `pending` to `latest`
  # (MANUAL APPROVAL #2). This is the gate that makes the new version the
  # default `npm install @unerr-ai/unerr` target.
  promote:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Manual-approval gate #2: a SEPARATE GitHub Environment named "npm-promote"
    # with its own required reviewer (Settings → Environments). The job holds
    # until that reviewer approves — distinct from the `npm-publish` gate above.
    environment: npm-promote

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Promote pending → latest
        # Flip the dist-tag so the new version becomes the default install target,
        # then remove the temporary `pending` tag for cleanliness.
        run: |
          npm dist-tag add @unerr-ai/unerr@${{ needs.publish.outputs.version }} latest
          npm dist-tag rm @unerr-ai/unerr@${{ needs.publish.outputs.version }} pending
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
