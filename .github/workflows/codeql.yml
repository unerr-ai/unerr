name: CodeQL

# Static analysis for security issues. Runs on every pull request and push
# to main, plus a weekly scan so findings surface even with no code churn.
#
# JavaScript/TypeScript is interpreted, so CodeQL extracts straight from
# source (build-mode: none) — no compile step, and no need to check out the
# private vendor/contracts submodule, which keeps this workflow working on
# pull requests from forks too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # every Monday, 04:23 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # init and analyze MUST stay on the same version. analyze reads the config
      # init wrote and refuses a mismatch with "Loaded a configuration file for
      # version X, but running version Y". Dependabot proposes them as two
      # separate pull requests because they are two action paths, so each one
      # alone reds the build — bump both in the same commit, never one.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
