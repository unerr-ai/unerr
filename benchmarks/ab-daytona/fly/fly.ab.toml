# Per-arm orchestrator app. Minimal on purpose: used only by
# `flyctl deploy --build-only` to build the image + register the app name.
# The actual arm is a one-shot machine launched imperatively by deploy-arm.sh
# (flyctl machine run --entrypoint /work/entrypoint.sh -e ARM=.. -e MODEL=..).
# No [http_service], no [[vm]], no [mounts] — it's a batch job, not a service.
#
# `app` here is a placeholder; deploy-arm.sh overrides it per arm with -a
# (e.g. ab-unerr-sonnet, ab-unerr-opus, ab-baseline-sonnet).
app = "ab-daytona-arm"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.ab"
